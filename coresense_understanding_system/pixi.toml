# Package manifest for Pixi: builds this ROS 2 package as a conda package.
# Name, version and dependencies come from package.xml. See the CoreSense
# guide: https://coresenseeu.github.io/tutorials/docs/pixi_release.html
[package]
publish = true

[package.build.backend]
name = "pixi-build-ros"
workspace = true

[package.build.config]
# The vendored json-schema-validator declares a CMake minimum below 3.5,
# which CMake 4 rejects.
env = { CMAKE_POLICY_VERSION_MINIMUM = "3.5" }
